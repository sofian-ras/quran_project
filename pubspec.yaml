name: quran
description: "Coran"
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.5.0 # Mis à jour pour plus de stabilité avec sqflite

dependencies:
  flutter:
    sdk: flutter
  archive: 4.0.7
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  rxdart: ^0.28.0
  dio: ^5.4.0
  image: ^4.7.2
  cupertino_icons: ^1.0.8
  # Ajout des outils pour la base de données
  http: ^1.1.0
  phosphor_flutter: ^2.1.0
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.0
  just_audio: ^0.9.36
  just_audio_background: ^0.0.1-beta.12
  audio_session: ^0.1.18
  asset_delivery: ^1.0.0
  shared_preferences: ^2.1.1
  share_plus: ^10.0.0
  url_launcher: ^6.2.0
  font_awesome_flutter: ^10.4.0
  flutter_svg: ^2.0.10
  flutter_native_splash: ^2.4.3
  scrollable_positioned_list: ^0.3.8
  connectivity_plus: ^6.1.4
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4
  workmanager: ^0.6.0
  flutter_compass: ^0.8.0
  home_widget: ^0.6.0

dev_dependencies:
  flutter_launcher_icons: 0.14.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0 # Version standard stable

flutter_native_splash:
  color: "#F2ECE5"
  color_dark: "#F2ECE5"
  android_12:
    icon_background_color: "#F2ECE5"
    icon_background_color_dark: "#F2ECE5"
  web: false
  ios: false

# Configuration pour générer l'icône
flutter_icons:
  android: true
  ios: false
  image_path: "assets/icon/logo_app_v6.png"  # chemin vers logo 512x512
  adaptive_icon_background: "#1A6B2A"  # fond vert pour adaptive icon Android
  adaptive_icon_foreground: "assets/icon/logo_app_v6.png"  # même image pour foreground


flutter:
  uses-material-design: true

  # Gestion des images et fichiers de données
  assets:
    - assets/data/husn_en.json
    - assets/data/quranpages1024.sqlite
    - assets/data/dua_pack_v1.json
    - assets/data/juz_mapping.json
    - assets/data/reciters_mapping.json
    - assets/data/reciters_bio.json
    - assets/images/
    - assets/images/dua_categories/
    - assets/images/navbar/Quran_Kareem.svg
    - assets/images/Features/
    - assets/images/Programmes/
    - assets/images/reciters/
    - assets/images/prieres/
    - assets/images/reprendre_lecture/reprendre_lecture.webp
    - assets/images/tafsir/
    - assets/images/Translated_Quran/
    - assets/images/Translated_Quran/surah_svg/
    - assets/data/
    - assets/data/ayahinfo_1120.db
    # - assets/assetpacks/quran_pages.zip
    - assets/radio/
    - assets/screenshots/
    - assets/fonts/
    - assets/icon/

  # Configuration des polices de caractères
  fonts:
    - family: UthmanTahaNaskh
      fonts:
        - asset: assets/fonts/UthmanTN_v2-0.ttf
    - family: UthmanicHafs
      fonts:
        - asset: assets/fonts/hafs.ttf
    - family: UthmanicWarsh
      fonts:
        - asset: assets/fonts/warsh.ttf
    - family: UthmanicSousi
      fonts:
        - asset: assets/fonts/sousi.ttf
    - family: UthmanicShouba
      fonts:
        - asset: assets/fonts/shouba.ttf
    - family: UthmanicQaloon
      fonts:
        - asset: assets/fonts/qaloon.ttf
    - family: UthmanicDoori
      fonts:
        - asset: assets/fonts/doori.ttf
    - family: UthmanicBazzi
      fonts:
        - asset: assets/fonts/bazzi.ttf
    - family: UthmanicQumbul
      fonts:
        - asset: assets/fonts/qumbul.ttf
    - family: ScheherazadeNew
      fonts:
        - asset: assets/fonts/ScheherazadeNew-Regular.ttf
        - asset: assets/fonts/ScheherazadeNew-Bold.ttf
          weight: 700
